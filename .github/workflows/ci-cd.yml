name: CI/CD Pipeline - Order Management System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOCKER_FRONTEND_IMAGE: rahul8352/order-management-frontend
  DOCKER_BACKEND_IMAGE: rahul8352/order-management-backend

jobs:
  # ==========================================
  # JOB 1: Backend Build & Unit/Integration Tests
  # ==========================================
  backend:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: soataskdb
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Execute Permissions to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Tests
        run: ./mvnw test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/soataskdb
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_JPA_HIBERNATE_DDL_AUTO: update

      - name: Package Spring Boot Executable JAR
        run: ./mvnw clean package -DskipTests

      - name: Upload Compiled Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/RestAPIAssignment-*.jar
          retention-days: 7

  # ==========================================
  # JOB 2: Frontend Build & Verification
  # ==========================================
  frontend:
    name: Frontend Build (Node.js 22 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Frontend Assets
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8050

      - name: Upload Frontend Static Distribution
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ==========================================
  # JOB 3: Build & Publish Application Docker Images
  # ==========================================
  docker:
    name: Docker Images Build & Publish
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials Availability
        id: check_auth
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "auth_available=true" >> $GITHUB_OUTPUT
            echo "Docker Hub authentication token detected."
          else
            echo "auth_available=false" >> $GITHUB_OUTPUT
            echo "No Docker Hub token found. Images will be built locally without pushing."
          fi

      - name: Log in to Docker Hub (if token present)
        if: steps.check_auth.outputs.auth_available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'rahul8352' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & (Optionally) Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.check_auth.outputs.auth_available == 'true' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.DOCKER_BACKEND_IMAGE }}:latest
            ${{ env.DOCKER_BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build & (Optionally) Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ steps.check_auth.outputs.auth_available == 'true' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.DOCKER_FRONTEND_IMAGE }}:latest
            ${{ env.DOCKER_FRONTEND_IMAGE }}:${{ github.sha }}
